<div id="app" class="container">

    <div id="toasts"></div>

    <div>
        <img id="logo" alt="Sad Panda" width="96" height="96">
    </div>

    <form id="login-form">

        <div class="form-group">
            <input id="username" class="form-control" type="text" placeholder="Username" autocomplete="username" required>
        </div>

        <div class="form-group">
            <input id="password" class="form-control" type="password" placeholder="Password" autocomplete="current-password" required>
        </div>

        <div class="form-check">
            <input id="remember-me" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="remember-me">Remember me</label>
        </div>

        <button type="submit" class="btn btn-success btn-lg btn-block">
            Sign in
        </button>

    </form>

    <div>
        <a href="https://github.com/okanah94/Sad-Panda" target="_blank" rel="noopener noreferrer">
            <img id="github" alt="GitHub Mark" height="22">
        </a>
    </div>

</div>
